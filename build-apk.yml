name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Installer dépendances système
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev python3-distutils

      # 3. Installer Buildozer et dépendances Python
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install buildozer cython kivy kivymd plyer setuptools

      # 4. Construire l’APK
      - name: Build APK with Buildozer
        run: |
          cd cenad
          buildozer android debug

      # 5. Sauvegarder l’APK comme artefact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: cenad-apk
          path: cenad/bin/*.apk

